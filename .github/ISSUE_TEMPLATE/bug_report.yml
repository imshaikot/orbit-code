name: Bug report
description: Something in the extension, the desktop app or the indexer doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem goes through [private reporting](https://github.com/imshaikot/orbit-code/security/advisories/new) instead, and an import the graph gets wrong has its own form, **Missing or wrong imports**.

  - type: dropdown
    id: host
    attributes:
      label: Where does it happen?
      options:
        - VS Code extension
        - The extension in another editor (Cursor, VSCodium, Windsurf, …)
        - Desktop app
        - Indexer CLI
        - Built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Orbit Code version
      description: The version in the Extensions view or the desktop app's About, or the commit when built from source.
      placeholder: 0.2.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Editor and operating system
      placeholder: VS Code 1.104.0 on macOS 15.6 (arm64)
    validations:
      required: true

  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: The output of `claude --version`, if the problem involves Claude. Leave it empty otherwise.
      placeholder: 2.1.267 (Claude Code)

  - type: dropdown
    id: area
    attributes:
      label: What is involved?
      multiple: true
      options:
        - The graph (indexing, live updates, layout)
        - The view (navigating, zooming, hovering, the Flat view, the tour)
        - Claude (prompts, permissions, questions, the transcript, the spark)
        - Skills, history or MCP
        - The file card or the editor sheet
        - Settings, commands or the status bar
        - Installing or packaging
        - Something else

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder with …
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The lines around the problem, `[webview]` lines included. In VS Code: View › Output, then **Orbit**. In the desktop app: File › Show Log.
        The log holds file paths and names; remove anything private.
      render: text

  - type: textarea
    id: workspace
    attributes:
      label: About the workspace
      description: Roughly how many files, the main languages, and whether it's a monorepo. A public repository that shows the problem helps most.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a recording
      description: Drag them in.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I removed secrets and private paths from what I pasted.
          required: true
