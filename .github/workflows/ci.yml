name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # apps/desktop depends on electron, whose install downloads Electron; only the desktop job needs it.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    name: Typecheck, build, boundaries, index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      # Nx's local task cache; the jobs below restore what this one built.
      - uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      - run: yarn typecheck
      # The webview's build also runs its constraint check (packages/webview/build.mjs).
      - run: yarn build
      - run: yarn boundaries
      # Catches a dependency-cruiser upgrade whose shims no longer match, without starting VS Code.
      - name: Index this repository
        run: |
          yarn index . --out "$RUNNER_TEMP/graph.json"
          node -e '
            const { stats, nodes } = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(`${stats.files} files, ${stats.edges} edges (dependency-cruiser ${stats.depcruiseFiles}, regex ${stats.regexFiles})`);
            if (stats.files < 40 || stats.edges < 40) throw new Error("graph is too small");
            if (!stats.depcruiseFiles) throw new Error("dependency-cruiser indexed no files");
            if (!nodes.some((node) => node.id === "packages/webview/src/main.ts")) throw new Error("packages/webview/src/main.ts is missing");
          ' "$RUNNER_TEMP/graph.json"

  package:
    name: Package .vsix
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      # The production build, then vsce through apps/vscode/scripts/package.mjs.
      - run: yarn package
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-code-vsix
          path: dist/apps/vscode/*.vsix
          if-no-files-found: error

  smoke:
    name: Smoke (VS Code)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vscode-test-${{ runner.os }}-
      # Without a claude CLI on the runner the probe logs `agent unavailable`, which smoke accepts.
      - run: xvfb-run -a yarn smoke
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: .harness/vscode-user/logs
          if-no-files-found: ignore

  harness:
    name: Harness (headless Chrome)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      # The harness only throws if the scene never loads; read report.json in the artifact for the checks.
      - run: yarn harness --chrome "$(command -v google-chrome)"
      # The server and the web client: refused sockets, the page under its CSP, a live update, a reload and a takeover.
      - run: yarn server:smoke --chrome "$(command -v google-chrome)"
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report
          path: .harness/out
          if-no-files-found: ignore

  desktop:
    name: Desktop app (Electron)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The one job that needs Electron itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/scripts/builder.mjs') }}
      - run: yarn install --immutable
      - uses: actions/cache/restore@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Without a claude CLI on the runner the probe logs `agent unavailable`, which the smoke accepts.
      - run: xvfb-run -a yarn desktop:smoke
      - run: yarn desktop:package --linux AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-code-desktop-linux
          path: dist/apps/desktop/*.AppImage
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-logs
          path: .harness/desktop-smoke
          if-no-files-found: ignore
