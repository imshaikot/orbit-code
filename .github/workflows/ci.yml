name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  VSCE: '@vscode/vsce@3.9.2'

jobs:
  check:
    name: Typecheck, build, index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      - run: yarn typecheck
      # Also runs checkConstraints() in esbuild.mjs.
      - run: yarn build
      # Catches a dependency-cruiser upgrade whose shims no longer match, without starting VS Code.
      - name: Index this repository
        run: |
          yarn index . --out "$RUNNER_TEMP/graph.json"
          node -e '
            const { stats, nodes } = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(`${stats.files} files, ${stats.edges} edges (dependency-cruiser ${stats.depcruiseFiles}, regex ${stats.regexFiles})`);
            if (stats.files < 40 || stats.edges < 40) throw new Error("graph is too small");
            if (!stats.depcruiseFiles) throw new Error("dependency-cruiser indexed no files");
            if (!nodes.some((node) => node.id === "src/webview/main.ts")) throw new Error("src/webview/main.ts is missing");
          ' "$RUNNER_TEMP/graph.json"

  package:
    name: Package .vsix
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      - run: node esbuild.mjs --production
      # The same vsce arguments as scripts/install-local.mjs.
      - run: yarn dlx --quiet "$VSCE" package --no-dependencies --allow-missing-repository --no-rewrite-relative-links --out orbit-code.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-code-vsix
          path: orbit-code.vsix
          if-no-files-found: error

  smoke:
    name: Smoke (VS Code)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vscode-test-${{ runner.os }}-
      # Without a claude CLI on the runner the probe logs `agent unavailable`, which smoke accepts.
      - run: xvfb-run -a yarn smoke
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: .harness/vscode-user/logs
          if-no-files-found: ignore

  harness:
    name: Harness (headless Chrome)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --immutable
      # The harness only throws if the scene never loads; read report.json in the artifact for the checks.
      - run: yarn harness --chrome "$(command -v google-chrome)"
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report
          path: .harness/out
          if-no-files-found: ignore
